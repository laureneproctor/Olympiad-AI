dataset:
  path: "/content/drive/MyDrive/Math Olympiad Competition/datasets/OpenMathReasoning_cot"
  filtering:
    problem_type: "has_answer_extracted"
    non_null_columns:
      - expected_answer
      - generated_solution
      - problem

models:
  qwen:
    name: "Qwen/Qwen3-8B"
    tokenizer_name: "Qwen/Qwen3-8B"
    provider: "huggingface"
    family: "Qwen"
    dtype: "bfloat16"
    device: "cuda"
    generation:
      max_input_length: 4096
      max_output_length: 1024
      temperature: 0.7
      top_p: 0.9
      do_sample: true

  deepseekmath:
    name: "deepseek-ai/deepseek-math-7b-instruct"
    tokenizer_name: "deepseek-ai/deepseek-math-7b-instruct"
    provider: "huggingface"
    family: "DeepSeekMath"
    dtype: "bfloat16"
    device: "cuda"
    generation:
      max_input_length: 4096
      max_output_length: 1024
      temperature: 0.7
      top_p: 0.9
      do_sample: true

experiments:
  exp1:
    seed: 42
    N: 100
    splits:
      train: 0.8
      val: 0.1
      test: 0.1
