dataset:
  path: "/content/drive/MyDrive/Math Olympiad Competition/datasets/OpenMathReasoning_cot"
  filtering:
    problem_type: "has_answer_extracted"
    require_single_integer_final_answer: true
    final_answer_column: "expected_answer"
    final_answer_min: 0
    final_answer_max: 99999
    debug_print_dropped_samples: true
    debug_dropped_sample_limit: 12
    debug_dropped_scan_limit: 60000
    non_null_columns:
      - expected_answer
      - generated_solution
      - problem

models:
  qwen:
    name: "Qwen/Qwen3-8B"
    tokenizer_name: "Qwen/Qwen3-8B"
    provider: "huggingface"
    family: "Qwen"
    dtype: "bfloat16"
    device: "cuda"
    generation:
      max_input_length: 4096
      max_output_length: 1024
      temperature: 0.7
      top_p: 0.9
      do_sample: true

  deepseekmath:
    name: "deepseek-ai/deepseek-math-7b-instruct"
    tokenizer_name: "deepseek-ai/deepseek-math-7b-instruct"
    provider: "huggingface"
    family: "DeepSeekMath"
    dtype: "bfloat16"
    device: "cuda"
    generation:
      max_input_length: 4096
      max_output_length: 1024
      temperature: 0.7
      top_p: 0.9
      do_sample: true

experiments:
  exp1:
    seed: 42
    N: 100000
    quality_rating_min: 1
    quality_rating_max: 3
    splits:
      train: 0.7
      val: 0.1
      val2: 0.1
      test: 0.1

  exp2:
    seed: 42
    N: 100000
    quality_rating_min: 1
    quality_rating_max: 5
    splits:
      train: 0.7
      val: 0.1
      val2: 0.1
      test: 0.1

  exp3:
    seed: 42
    N: 100000
    quality_rating_min: 1
    quality_rating_max: 10
    splits:
      train: 0.7
      val: 0.1
      val2: 0.1
      test: 0.1