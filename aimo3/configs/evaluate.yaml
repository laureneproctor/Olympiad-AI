# Define evaluation runs
# - Which model to evaluate
# - Which dataset split to evaluate on 
# - Evaluation limit ( how many items)
# - maj@N sample count
# - Generation settings for evaluation
# - Where to save the report


run:
  seed: 42

paths:
  data_config_path: null  # uses default if null
  model_checkpoint: "/path/to/trained/model"
  dataset_path: "/path/to/prepared/splits"
  output_dir: "runs/evaluation"

evaluation:
  # Dataset split to evaluate on: train, val, or test
  split: "test"
  
  # Max number of items to evaluate (null = evaluate all)
  max_items: 100
  
  # Pass@1 evaluation (greedy decoding)
  eval_pass1: true
  pass1_max_new_tokens: 512
  
  # Maj@N evaluation (sampling + majority vote)
  eval_majn: true
  majn_n_samples: 8
  majn_max_items: 50  # evaluate fewer items for maj@N (more expensive)
  majn_max_new_tokens: 512
  majn_temperature: 0.7
  majn_top_p: 0.95

reporting:
  # Save report JSON
  save_report: true
  report_filename: "evaluation_report.json"
  
  # Print detailed stats
  verbose: true