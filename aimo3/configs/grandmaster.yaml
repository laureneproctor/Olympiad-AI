defaults:
  seed: 42

  splits:
    standard:
      train: 0.8
      val: 0.1
      test: 0.1
    large:
      train: 0.90
      val: 0.05
      test: 0.05

  prompting:
    math_solver: &math_solver_prompt |
      You are a mathematical problem solver.
      Solve step-by-step.
      At the end, output a line exactly of the form:
      FINAL_ANSWER: <integer>
      Where <integer> is an integer between 0 and 99999.

  lora: &default_lora
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bias: "none"
    task_type: "CAUSAL_LM"
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"

  quantization:
    sft: &quant_sft
      enabled: true
      load_in_4bit: true
      bnb_4bit_quant_type: "nf4"
      bnb_4bit_use_double_quant: true
      bnb_4bit_compute_dtype: "bfloat16"

    grpo: &quant_grpo
      enabled: false
      load_in_4bit: true
      bnb_4bit_quant_type: "nf4"
      bnb_4bit_use_double_quant: true
      bnb_4bit_compute_dtype: "bfloat16"

paths:
  dataset_root: "/content/drive/MyDrive/Math Olympiad Competition/datasets"
  processed_root: "/content/drive/MyDrive/Math Olympiad Competition/Experimentation/processed_splits/omr_aimo3"
  models_root: "/content/drive/MyDrive/Math Olympiad Competition/Experimentation/models"
  runs_root: "/content/drive/MyDrive/Math Olympiad Competition/Experimentation/runs"
  rl_root: "/content/drive/MyDrive/Math Olympiad Competition/Experimentation/rl_train"

models:
  qwen:
    name: "Qwen/Qwen3-8B"
    tokenizer_name: "Qwen/Qwen3-8B"
    provider: "huggingface"
    family: "Qwen"
    dtype: "bfloat16"
    device: "cuda"
    generation: &default_generation
      max_input_length: 4096
      max_output_length: 1024
      temperature: 0.7
      top_p: 0.9
      do_sample: true

  deepseekmath:
    name: "deepseek-ai/deepseek-math-7b-instruct"
    tokenizer_name: "deepseek-ai/deepseek-math-7b-instruct"
    provider: "huggingface"
    family: "DeepSeekMath"
    dtype: "bfloat16"
    device: "cuda"
    generation: *default_generation

data:
  dataset:
    path: "/content/drive/MyDrive/Math Olympiad Competition/datasets/OpenMathReasoning_cot"
    filtering:
      problem_type: "has_answer_extracted"
      non_null_columns: [expected_answer, generated_solution, problem]

experiments:
  exp1: {N: 100, splits: standard, models: [qwen, deepseekmath]}
  exp2: {N: 1000, splits: standard, models: [qwen, deepseekmath]}
  exp3: {N: 10000, splits: standard, models: [qwen, deepseekmath]}
  exp4: {N: 100000, splits: standard, models: [qwen, deepseekmath]}
  exp5: {N: 200000, splits: large, models: [qwen, deepseekmath]}

stages:
  sft:
    run:
      experiment_name: "exp5"
      model_key: "qwen"
    prompting:
      system_prompt: *math_solver_prompt
    data:
      train_split: "train"
      eval_split: "val"
      test_split: "test"
      fields: 
        problem: "problem"
        reasoning: "generated_solution"
        answer: "expected_answer"
        text: "text"
        
    quantization: *quant_sft
    lora: *default_lora
    training:
      max_seq_length: 2048
      per_device_train_batch_size: 1
      per_device_eval_batch_size: 1
      gradient_accumulation_steps: 8
      num_train_epochs: 1
      learning_rate: 5.0e-5
      warmup_steps: 50
      logging_steps: 10
      evaluation_strategy: "steps"
      eval_steps: 50
      save_strategy: "steps"
      save_steps: 50
      save_total_limit: 1
      bf16: true
      gradient_checkpointing: true
      report_to: []
      packing: false

  mine:
    run: {}
    generation:
      k_solutions: 8
      max_new_tokens: 512
      temperature: 0.7
      top_p: 0.95
    failure_criteria:
      mine_if_majority_wrong: true
      mine_if_low_agreement: true
      low_agreement_threshold: 0.5
      mine_if_low_format_validity: true
      low_format_validity_threshold: 0.5
      mine_if_no_valid_extraction: true

  grpo:
    run:
      experiment_name: "exp5"
      model_key: "qwen"
    prompting:
      system_prompt: *math_solver_prompt
    quantization: *quant_grpo
    lora: *default_lora
    training:
      per_device_train_batch_size: 1
      gradient_accumulation_steps: 4
      num_train_epochs: 1
      learning_rate: 5.0e-6
      max_prompt_length: 512
      max_completion_length: 512
      group_size: 4
      beta: 0.04
      logging_steps: 1
      save_steps: 50
      save_total_limit: 1
      bf16: true
      gradient_checkpointing: true
      report_to: []

  solve:
    run: {}
    prompting:
      system_prompt: *math_solver_prompt
    generation:
      n_samples: 8
      max_new_tokens: 512
      temperature: 0.7
      top_p: 0.95

  grpo_evaluation:
    run: {}
    evaluation:
      split: "test"
      max_items: null
      eval_pass1: true
      pass1_max_new_tokens: 512
      eval_majn: true
      majn_n_samples: 8
      majn_max_items: null
      majn_max_new_tokens: 512
      majn_temperature: 0.7
      majn_top_p: 0.95
    reporting:
      save_report: true
      report_filename: "evaluation_report_grpo_qwen.json"
      verbose: true